<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PSX API Data Test</title>

</head>

<body>

    <h1>ABL API Data</h1>

    <div id="result">
        Loading...
    </div>


    <script>

        async function loadABL() {

            try {

                const response =
                    await fetch(
                        "https://api.psxlens.com/v1/quotes/ABL"
                    );

                if (!response.ok) {

                    throw new Error(
                        "HTTP Error: " + response.status
                    );

                }

                const data =
                    await response.json();


                document.getElementById("result").innerHTML = `

                    <h2>Raw API Response</h2>

                    <pre>
${JSON.stringify(data, null, 2)}
                    </pre>

                `;


                console.log("ABL API DATA:", data);

            }

            catch (error) {

                document.getElementById("result").innerHTML =

                    "<p>API Error: " +
                    error.message +
                    "</p>";

                console.error(error);

            }

        }


        loadABL();

    </script>

</body>

</html>
